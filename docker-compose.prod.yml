# Учебный demo-профиль. Не публичный production.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: demo
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      DEMO_SEED: "true"
      DB_PATH: data/helpdesk.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
