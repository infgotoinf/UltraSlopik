name: ServiceDesk CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality tool
        run: python tools.py setup
      - name: Lint and business tests
        run: python tools.py check
      - name: Release archive
        run: python tools.py build
      - uses: actions/upload-artifact@v4
        with:
          name: ServiceDesk-release
          path: dist/ServiceDesk-*.zip
